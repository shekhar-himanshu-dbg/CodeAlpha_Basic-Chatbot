<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Basic Chatbot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="app-container">

        <!-- Header -->
        <header class="chat-header">

            <div class="bot-profile">

                <div class="bot-avatar">
                    🤖
                </div>

                <div>
                    <h1>Basic Chatbot</h1>

                    <div class="status">
                        <span class="status-dot"></span>
                        Online
                    </div>
                </div>

            </div>

            <button
                id="clearChat"
                class="clear-button"
                title="Clear conversation"
            >
                🗑️
            </button>

        </header>


        <!-- Chat Area -->
        <section
            id="chatMessages"
            class="chat-messages"
            aria-live="polite"
        >

            <div class="message bot-message">

                <div class="message-avatar">
                    🤖
                </div>

                <div class="message-content">

                    <div class="message-bubble">
                        Hello! 👋 I'm your rule-based chatbot.
                        How can I help you today?
                    </div>

                    <span class="message-time">
                        Just now
                    </span>

                </div>

            </div>

        </section>


        <!-- Typing Indicator -->
        <div
            id="typingIndicator"
            class="typing-indicator hidden"
        >
            <span></span>
            <span></span>
            <span></span>
            Bot is typing...
        </div>


        <!-- Input Area -->
        <footer class="chat-input-area">

            <form id="chatForm">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Type your message..."
                    autocomplete="off"
                    maxlength="500"
                >

                <button
                    id="sendButton"
                    type="submit"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </form>

            <p class="hint">
                Press Enter to send • Type "help" for commands
            </p>

        </footer>

    </main>


    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>

</body>

</html>
